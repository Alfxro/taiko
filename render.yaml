services:
  - type: web
    name: taiko-web
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: MULTIPLAYER_URL
        fromService:
          type: web
          name: taiko-ws
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: taiko-ws
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py $PORT -b 0.0.0.0
